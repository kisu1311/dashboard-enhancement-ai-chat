function gSend(e){
  if (e) e.preventDefault();
  if (G.ment) gMentHide();
  const ta = $('gTa'), q = ta.value.trim();
  if (G.busy) return;
  if (!q){ ta.focus(); return; }   /* never a dead press */
  /* the pinned chips are not decoration — they are stamped on the turn and printed under
     the answer, so what the chat was reading is on the record with the reply */
  const scope = gCtxFloor() ? '' : 'Scoped to ' + G.ctx.join(' + ');
  G.thread.push({ q, a:'', scope });
  ta.value = ''; G.busy = true; gGrow();
  /* ⚠️ THE CHAT IS FILED ON ITS FIRST QUESTION (request, 17 Sep 2026: "How are our
     network paths doing today." set in history). Iris's own rule: a chat enters the list once
     it has been USED and is auto-named from the question that started it — so the column
     cannot fill with empty conversations, and the row's name is a thing you would recognise.
     ⚠️ ONLY THE FIRST TURN FILES. `G.open === null` IS the test for "this chat is not
     in the list yet"; a later question in the same chat must not open a second row, and it
     must not retitle the row either — the name is what the chat was ABOUT when it started.
     ⚠️ THE ROW HOLDS THE THREAD BY REFERENCE, which is what makes reopening it show what
     was actually said rather than a fresh answer to its title. `gNewChat` assigns a NEW array
     rather than emptying this one, so the filed chat keeps its own. */
  if (G.open === null){
    G_CHATS.unshift({ n:q, t:Date.now(), thread:G.thread });
    G.open = 0;
    gListPaint();
  }
  const run = gRunFor(q);
  if (run){
    /* the turn owns its own run state, so a second ask does not reach into the first one's */
    G.thread[G.thread.length - 1].run =
      { steps: run.steps, i: 0, open: true, done: false, t0: Date.now(), a: run.a };
    gThreadPaint();
    clearTimeout(G.t);
    gRunTick();
    return;
  }
  gThreadPaint();
  clearTimeout(G.t);
  G.t = setTimeout(() => {
    G.thread[G.thread.length - 1].a = gAnswer(q);
    G.busy = false; gThreadPaint(); gGrow();
  }, 620);
}

/* ⚠️ IT REVEALS ONE BEAT PER TICK AND FOLDS ITSELF WHEN THE ANSWER LANDS — the trail is open
   while it is the only thing to read and collapsed once there is something better. `index.html`
   settled on the same default after trying both.
   ⚠️ `clearTimeout(G.t)` is what `gNewChat` already calls, so abandoning a run mid-flight
   cannot land an answer into a thread that has been cleared — the recorded `agClose()` rule
   about a timer outliving the thing it was drawing. */
function gRunTick(){
  const t = G.thread[G.thread.length - 1], r = t && t.run;
  if (!r || r.done) return;
  r.i++;
  if (r.i >= r.steps.length){
    r.done = true; r.open = false;
    r.secs = Math.max(1, Math.round((Date.now() - r.t0) / 1000));
    t.a = r.a; G.busy = false; gThreadPaint(); gGrow(); return;
  }
  gThreadPaint();
  G.t = setTimeout(gRunTick, G_NET_RUN.ms);
}

/* ── the model / effort pickers ──────────────────────────────────────────────────────── */
function gMenu(anchor, items, current, pick, place){
  gMenuClose();
  const m = document.createElement('div');
  m.className = 'gmenu'; m.id = 'gMenu';
  m.innerHTML = items.map(v =>
    '<button class="gpi' + (v === current ? ' on' : '') + '" data-v="' + gEsc(v) + '">'
    + '<span class="gtick">' + G_IC.tick + '</span>' + gEsc(v) + '</button>').join('');
  document.body.appendChild(m);
  /* measure, place, THEN show — a menu positioned before it has a box lands at the wrong
     anchor, the recorded `kbPopOpen` lesson */
  const r = anchor.getBoundingClientRect(), b = m.getBoundingClientRect();
  m.style.left = Math.max(8, Math.min(r.left, innerWidth - b.width - 8)) + 'px';
  /* the pickers hang ABOVE their pill (they sit on the composer's floor); the name trigger
     is at the top of the rail, so its menu drops BELOW it */
  m.style.top = place === 'below'
    ? Math.min(r.bottom + 6, innerHeight - b.height - 8) + 'px'
    : Math.max(8, r.top - b.height - 6) + 'px';
  m.addEventListener('click', ev => {
    const it = ev.target.closest('.gpi'); if (!it) return;
    pick(it.dataset.v); gMenuClose();
  });
}
/* ⚠️ IT REMOVES THE ATTRIBUTE RATHER THAN SETTING IT FALSE. `#gName` is a plain New-chat
   button now, and `aria-expanded="false"` advertises a collapsed menu that does not exist —
   the tidy-up ran on every Esc and click-away, so the markup grew the promise back the moment
   anything closed. `removeAttribute` is also correct if `gNameMenu` is ever pointed back:
   `gMenu` sets the pair, this clears it. */
function gMenuClose(){
  const m = $('gMenu'); if (m) m.remove();
  const n = $('gName');
  if (n){ n.classList.remove('open'); n.removeAttribute('aria-expanded'); }
}

/* ── wiring ──────────────────────────────────────────────────────────────────────────── */
function gInit(){
  gIcons(); gHomePaint(); gPills(); gCtxPaint(); gNamePaint(); gListPaint(); gGrow();

  $('gComp').addEventListener('submit', gSend);
  $('gTa').addEventListener('input', () => { gGrow(); gMentIn(); });
  $('gTa').addEventListener('keydown', e => {
    if (G.ment){
      if (e.key === 'ArrowDown'){ e.preventDefault(); return gMentMove(1); }
      if (e.key === 'ArrowUp'){   e.preventDefault(); return gMentMove(-1); }
      if (e.key === 'Enter' && G.ment.length){ e.preventDefault(); return gMentPick(G.ment[G.mentHi]); }
      if (e.key === 'Escape'){    e.preventDefault(); return gMentHide(); }
    }
    if (e.key === 'Enter' && !e.shiftKey){ e.preventDefault(); gSend(); }
  });

  $('gAt').addEventListener('click', e => { e.stopPropagation(); gAtTap(); });

  /* the mention list is inside the composer, so its own clicks must not reach the
     document dismisser below */
  $('gComp').addEventListener('click', e => {
    const mi = e.target.closest('.gmi');
    if (mi){ e.stopPropagation(); return gMentPick(mi.dataset.m); }
    const drop = e.target.closest('[data-drop]');
    if (drop){ G.ctx.splice(+drop.dataset.drop, 1); gCtxPaint(); }
  });

  /* the starters and the two help links — delegated, because gHomePaint rebuilds them */
  $('gHome').addEventListener('click', e => {
    const c = e.target.closest('[data-cta]');
    if (c){ $('gTa').value = G_CTA[+c.dataset.cta]; gGrow(); return gSend(); }
    const h = e.target.closest('[data-href]');
    if (h) window.open(h.dataset.href, '_blank', 'noopener');
  });

  $('gModel').addEventListener('click', e => {
    e.stopPropagation();
    gMenu($('gModel'), G_MODELS, G.model, v => { G.model = v; gPills(); gThreadPaint(); });
  });
  $('gEffort').addEventListener('click', e => {
    e.stopPropagation();
    gMenu($('gEffort'), G_EFFORTS, G.effort, v => { G.effort = v; gPills(); gThreadPaint(); });
  });

  /* ⚠️ `gMenuClose()` FIRST: the model and effort pickers open from the composer and a press
     up here must put whichever one is open away rather than leave it hanging over a thread
     that has just been cleared. */
  $('gName').addEventListener('click', e => {
    e.stopPropagation();
    gMenuClose();
    gNewChat();
  });

  /* the field filters the list in place — one surface, not a second one. Esc clears it. */
  $('gQ').addEventListener('input', e => { G.q = e.target.value; gListPaint(); });

  /* the trail folds and unfolds — delegated, because `gThreadPaint` rebuilds the thread on
     every tick and a bound handler would be thrown away with the node it was on */
  $('gThread').addEventListener('click', e => {
    const h = e.target.closest('[data-trail]'); if (!h) return;
    const t = G.thread[+h.dataset.trail];
    if (t && t.run){ t.run.open = !t.run.open; gThreadPaint(); }
  });

  /* ⚠️ ONE DELEGATED LISTENER PER THING, ON THE SAME REBUILT CONTAINER — `gThreadPaint`
     replaces `#gThread`'s markup on every render, so a listener bound to a BUTTON would be
     thrown away with it (and re-bound per paint would stack). */
  $('gThread').addEventListener('click', e => {
    const b = e.target.closest('.gcopy'); if (!b) return;
    const turn = G.thread[+b.dataset.copy]; if (!turn) return;
    gCopy(turn.q, b);
  });

  /* the chart type — Ask Iris's own behaviour: it re-renders the ART IN PLACE.
     ⚠️ IT MUST NOT CALL `gThreadPaint()`. That rebuilds the whole thread, which would
     destroy the button under the pointer mid-press AND scroll the thread back to its floor —
     so pressing Bar would move the card you were looking at. Only the plot and the four
     buttons' own state change; `G.ct` is what carries the choice through the next repaint. */
  $('gThread').addEventListener('click', e => {
    const b = e.target.closest('[data-ct]'); if (!b) return;
    const k = b.dataset.ct;
    if (k === G.ct) return;
    G.ct = k;
    const plot = $('gChartPlot'); if (plot) plot.innerHTML = gPlot(k);
    b.closest('.gctt').querySelectorAll('.gctb').forEach(x => {
      const on = x.dataset.ct === k;
      x.classList.toggle('on', on);
      x.setAttribute('aria-pressed', on);
    });
  });

  $('gList').addEventListener('click', e => {
    const row = e.target.closest('.gchat'); if (!row) return;
    G.open = +row.dataset.i;
    const c = G_CHATS[G.open];
    /* ⚠️ A FILED CHAT REOPENS ITS OWN THREAD, and the shipped one BUILDS its thread the
       first time it is opened — the recorded run, already folded and answered, cached on the
       record so a second visit is the same conversation rather than a fresh one.
       ⚠️ The title fallback is what a `G_CHATS_SEED` row needs — those carry names and
       times, not conversations — so it stays for the day those are restored. */
    if (!c.thread && c.seedRun) c.thread = [{ q:c.n, a:G_NET_RUN.a, scope:'',
      run:{ steps:G_NET_RUN.steps, i:G_NET_RUN.steps.length, open:false, done:true,
            secs:7, t0:Date.now() - 7000 } }];
    G.thread = c.thread || [{ q:c.n, a:gAnswer(c.n), scope:'' }];
    gNamePaint(); gListPaint(); gThreadPaint();
  });

  /* ⚠️ DOCKING ALWAYS CLEARS THE PEEK. They are two ways to show the same column, and a peek
     left standing over a docked column is a floating copy of what is already in flow. */
  const tog = () => { document.body.classList.remove('gpeek'); gPeekCancel();
                      document.body.classList.toggle('gshut'); };
  $('gTog').addEventListener('click', tog);
  $('gOpen').addEventListener('click', tog);

  $('gClose').addEventListener('click', () => {
    if (history.length > 1) history.back(); else location.href = 'index.html';
  });

  /* ══ THE HOVER PEEK (request, 21 Sep 2026) ═════════════════════════════════
     ⚠️ OPENING IS DELAYED AND CLOSING IS DEFERRED, which is this folder's own kbPop rule and it
     is load-bearing in both directions: without the 140ms, sweeping the header flashes a 288px
     column; without the 200ms, the pointer cannot cross the gap from the button to the list it
     just opened — the recorded rail-flyout bug. The list's own mouseenter cancels the close.
     ⚠️ IT ONLY ARMS WHILE THE COLUMN IS HIDDEN. `#gOpen` is `display:none` unless `body.gshut`,
     so this can never fire over a docked column, but the guard states it rather than relying on
     a CSS rule to enforce a JS precondition.
     ⚠️ ANY CLICK INSIDE THE COLUMN ENDS THE PEEK. Picking a chat paints a thread behind a
     floating list that is no longer about anything; `gTog` is handled by `tog` above, which
     removes the class itself, so clearing it here is safe for that path too. */
  $('gSide').addEventListener('mouseenter', () => { gPeekIn = true; gPeekCancel(); });
  $('gSide').addEventListener('mouseleave', () => { gPeekIn = false; gPeekClose(); });
  $('gSide').addEventListener('click', () => document.body.classList.remove('gpeek'));
  $('gOpen').addEventListener('mouseenter', gPeekOpen);
  $('gOpen').addEventListener('mouseleave', gPeekClose);

  document.addEventListener('click', () => { gMenuClose(); if (G.ment) gMentHide(); });
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape'){
      if ($('gMenu')) return gMenuClose();
      if (G.ment) return gMentHide();
      if (G.q){ G.q = ''; $('gQ').value = ''; gListPaint(); }
    }
  });

  $('gTa').focus();
}
document.addEventListener('DOMContentLoaded', gInit);
</script>
