<!-- Agentation: dev-only design-feedback widget (never loads for end users) -->
<script>
(function () {
  var dev = location.protocol === 'file:' ||
            location.hostname === 'localhost' ||
            location.hostname === '127.0.0.1';
  if (!dev) return;
  var st = document.createElement('style');
  st.id = 'agentation-stacking-fix';
  st.textContent =
    '[data-agentation-root] > *{z-index:2147483000 !important}' +
    '[data-agentation-root] > [class*="markersLayer" i]{z-index:2147483001 !important}' +
    '[data-agentation-root] > [class*="toolbar"]{z-index:2147483002 !important}';
  document.head.appendChild(st);
  var s = document.createElement('script');
  s.src = 'agentation-embed.js';
  s.defer = true;
  document.body.appendChild(s);
})();
</script>
</body>
</html>
