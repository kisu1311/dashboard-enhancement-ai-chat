<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>ObserveOps Module Work</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: the product's own sidebar on the left (Dashboard_with_AI_Chat/index.html, Option 1, open state: same rows,
   order, icons, sizes and colours), the work built for the picked module on the right. */
:root{
  --bg:#fff; --text:#1d2a3e; --muted:#6a7fa0; --line:#e3e8f2; --tag:#e3e8f2;
  --ok:#14b053; --warn:#f47c22; --accent:#14b8a6;
  /* the sidebar's own tokens, light */
  --rail:#F6F9FC; --rail-line:#e3e8f2; --rail-text:#24344d; --rail-dim:#5b6b85; --rail-hover:#ecf1f9;
  --pill:#24344d; --ink:#f4f7fb; --field:#fff;
  --sans:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --bg:#07101f; --text:#cad3e2; --muted:#8e9fbc; --line:#1d2a3e; --tag:#2b394f; --ok:#36d576; --warn:#fa9950; --accent:#14b8a6;
    --rail:#172336; --rail-line:#1d2a3e; --rail-text:#cad3e2; --rail-dim:#8a9ab0; --rail-hover:#22314a; --pill:#c9d4e4; --ink:#172336; --field:#0c1728; color-scheme:dark }
}
:root[data-theme="dark"]{ --bg:#07101f; --text:#cad3e2; --muted:#8e9fbc; --line:#1d2a3e; --tag:#2b394f; --ok:#36d576; --warn:#fa9950; --accent:#14b8a6;
  --rail:#172336; --rail-line:#1d2a3e; --rail-text:#cad3e2; --rail-dim:#8a9ab0; --rail-hover:#22314a; --pill:#c9d4e4; --ink:#172336; --field:#0c1728; color-scheme:dark }

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font:13px/1.5 var(--sans)}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.app{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100%}

/* ── the sidebar: 240px, 56px head, 32px rows 10px apart, 4px radius ── */
.rail{background:var(--rail);color:var(--rail-text);border-right:1px solid var(--rail-line);
  position:sticky;top:0;height:100vh;display:flex;flex-direction:column;
  padding-left:env(safe-area-inset-left, 0px)}
.shead{flex:0 0 56px;display:flex;align-items:center;position:relative}
.strig{flex:1;min-width:0;height:56px;display:flex;align-items:center;gap:11px;padding:0 18px;border:0;background:none;cursor:pointer;text-align:left;color:var(--rail-text)}
.strcol{flex:0 0 32px;width:32px;height:32px;margin-right:10px;display:grid;place-items:center;border:0;border-radius:4px;background:none;color:var(--rail-dim);cursor:pointer}
.strcol:hover{background:var(--rail-hover);color:var(--rail-text)}
.strcol svg{width:18px;height:18px;fill:currentColor}
.strcol g{transition:transform .18s;transform-origin:28.5px 24px;transform:scaleX(-1)}
/* collapsed: the 53px icon rail. The mark gives way to the expand button when the rail is hovered or focused. */
@media (min-width:761px){
.app.is-railmin{grid-template-columns:53px minmax(0,1fr)}
.is-railmin .strig{position:absolute;inset:0;padding:0;justify-content:center;pointer-events:none}
.is-railmin .strig b{display:none}
.is-railmin .strcol{margin:0 auto;opacity:0;position:relative}
.is-railmin .strcol g{transform:none}
.is-railmin .rail:hover .strcol,.is-railmin .strcol:focus-visible{opacity:1}
.is-railmin .rail:hover .strig,.is-railmin .shead:focus-within .strig{opacity:0}
.is-railmin .mod{width:32px;margin:0 auto 10px;padding:0;justify-content:center}
.is-railmin .mod .nm,.is-railmin .mod .ct,.is-railmin .mod .chev,.is-railmin .kids,.is-railmin .find input{display:none}
.is-railmin .find{width:32px;margin:0 auto 10px;padding:0;justify-content:center;cursor:pointer}
.is-railmin .sfoot::before{margin:0 14px 10px}
}
.strig svg{width:24px;height:24px;flex:0 0 24px}
.strig b{font-size:14px;font-weight:600}
.smenu{flex:1 1 auto;min-height:0;overflow-y:auto;padding-bottom:8px}
.sfoot{flex:0 0 auto;padding-top:10px;margin-top:auto}
.sfoot::before{content:"";display:block;height:0;border-top:1px solid var(--rail-line);margin:0 14px 10px}
.gap{height:0;margin:0}
.mod{display:flex;align-items:center;gap:11px;width:calc(100% - 20px);height:32px;margin:0 10px 10px;padding:0 8px;
  border:0;border-radius:4px;background:none;color:var(--rail-text);text-align:left;cursor:pointer}
.mod:hover{background:var(--rail-hover)}
.mod svg.ic{width:18px;height:18px;flex:0 0 18px;fill:currentColor}
.mod .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px;font-weight:500;display:flex;align-items:center;gap:7px}
.mod .ct{font:500 11px var(--mono);color:var(--rail-dim);font-variant-numeric:tabular-nums}
.mod.zero .ct{display:none}
.mod .chev{width:14px;height:14px;flex:0 0 14px;fill:currentColor;color:var(--rail-dim);transition:transform .15s}
.mod.exp.open .chev{transform:rotate(90deg)}
.mod.on{background:var(--pill);color:var(--ink)}
.mod.on .ct{color:var(--ink);opacity:.85}
.beta{font:600 9.5px var(--sans);letter-spacing:.05em;padding:1px 5px;border-radius:3px;background:var(--rail-hover);color:var(--rail-dim)}
.mod.on .beta{background:none;color:var(--ink)}
.kids .mod{padding-left:37px;margin-bottom:4px}
.kids{padding-bottom:6px}
.find{display:flex;align-items:center;gap:11px;height:32px;margin:0 10px 10px;padding:0 8px;border-radius:4px;background:var(--field);color:var(--rail-text)}
.find:focus-within{outline:1px solid var(--accent)}
.find svg{width:18px;height:18px;flex:0 0 18px;fill:currentColor}
.find input{flex:1;min-width:0;border:0;background:none;outline:0;color:var(--rail-text);font-size:13px;font-weight:500}
.find input::placeholder{color:var(--rail-text);opacity:1}
.find input:focus::placeholder{color:var(--rail-dim)}

/* ── main ── */
.main{min-width:0;padding-block:24px 48px;padding-left:28px;padding-right:max(28px, env(safe-area-inset-right, 0px));max-width:1240px}
.head{padding-bottom:16px;border-bottom:1px solid var(--line)}
.eyebrow{color:var(--muted);font-size:12px}
h1{margin:2px 0 0;font:600 22px/1.25 var(--sans);text-wrap:balance}
.sum{color:var(--muted);margin-top:4px}

.sec{margin-top:26px}
.sech{display:flex;align-items:baseline;gap:10px;margin-bottom:4px}
.sech button{border:0;background:none;padding:0;cursor:pointer;font:600 14px var(--sans)}
.sech button:hover{text-decoration:underline}
.sech span{color:var(--muted);font-size:12px}

.item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 20px;padding:14px 0;border-bottom:1px solid var(--line)}
.item .ti{font-weight:600;font-size:14px}
.meta{display:flex;align-items:center;gap:8px 12px;flex-wrap:wrap;color:var(--muted);font-size:12px;margin-top:3px}
.kind{background:var(--tag);color:var(--text);border-radius:4px;padding:1px 7px;font-size:11.5px}
.st{display:inline-flex;align-items:center;gap:6px}
.st i{width:7px;height:7px;border-radius:50%;background:var(--muted)}
.st.live i{background:var(--ok)} .st.wip i{background:var(--warn)}
.date{font-family:var(--mono);font-variant-numeric:tabular-nums}
.note{grid-column:1;margin-top:6px;max-width:68ch;overflow-wrap:anywhere}
.file{grid-column:1;margin-top:6px;font:12px var(--mono);color:var(--muted);overflow-wrap:anywhere}
.open{grid-column:2;grid-row:1;align-self:start;display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 10px;
  border:1px solid var(--line);border-radius:4px;color:var(--text);text-decoration:none;font-weight:500;white-space:nowrap}
.open:hover{border-color:var(--accent)}
.open svg{width:14px;height:14px}

/* ── live component stage (Mira AI) ── */
.stage{margin-top:22px}
.stage h2{margin:0;font:600 15px var(--sans)}
.stage .sub{color:var(--muted);margin-top:2px;max-width:70ch}
.cbuild{font:500 11.5px var(--mono);white-space:nowrap}
/* two panes: the component list on the left, the picked component (its options, then the stage) on the right */
.cgrid{display:grid;grid-template-columns:212px minmax(0,1fr);gap:20px;margin-top:16px;align-items:start}
.clist{display:flex;flex-direction:column;gap:2px;border:1px solid var(--line);border-radius:8px;padding:6px}
.ctab{display:flex;align-items:center;gap:8px;min-height:34px;padding:5px 10px;border:0;border-radius:4px;background:none;cursor:pointer;font-weight:500;text-align:left}
.ctab span{flex:1;min-width:0}
.ctab i{font:500 11px var(--mono);font-style:normal;color:var(--muted);font-variant-numeric:tabular-nums}
.ctab:hover{background:var(--tag)}
/* category headings in the component list (Mira AI: Chat · UI visualization) */
.ccat{padding:10px 10px 4px;font:600 11px var(--sans);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.ccat:first-child{padding-top:4px}
.ctab.on{background:var(--pill);color:var(--ink)}
.ctab.on i{color:var(--ink);opacity:.8}
.cmain{min-width:0}
.chead{display:flex;align-items:flex-start;gap:12px 20px;flex-wrap:wrap}
.chead .tx{flex:1;min-width:220px}
.ctitle{font:600 17px/1.3 var(--sans)}
.cact{display:flex;align-items:center;gap:8px}
/* options: one tab per variant, on a rule, so a component can carry many */
.cvars{display:flex;flex-wrap:wrap;gap:0 4px;margin-top:12px;border-bottom:1px solid var(--line)}
.cvars button{height:34px;padding:0 12px;border:0;border-bottom:2px solid transparent;margin-bottom:-1px;background:none;cursor:pointer;color:var(--muted);font-weight:500;white-space:nowrap}
.cvars button:hover{color:var(--text)}
.cvars button.on{color:var(--text);border-bottom-color:var(--accent);font-weight:600}
.cvars .n{font:500 11px var(--mono);color:var(--muted);margin-right:6px}
/* options: ONE bar above the stage (request, 23 Nov 2026 - numbered tabs on three lines, then a list in the left rail, were
   both too confusing). Option = a segmented control, always visible; its states, when it has several, = one State dropdown.
   A label's text before the first " · " is the option, the rest is the state. */
.copt{display:flex;align-items:center;flex-wrap:wrap;gap:8px 10px;margin-top:12px;font-size:12px;color:var(--muted)}
.copt[hidden]{display:none}
.copt{position:relative}
.copt .lab{min-width:40px}
/* the states use the same segmented control as Option (request, 23 Nov 2026: "show like this type of tab"). One long control
   wrapped into a ragged two-line box ("fix this ui"), so the states are split by feature into SMALL segmented controls -
   Filter [List menu | Switch + dates | Chip row] - that wrap as whole units with a gap, each one a clean box. */
.copt .cstr{display:flex;align-items:flex-start;gap:10px;flex:1 0 100%}
.copt .cstr .lab{line-height:30px}
.copt .sgw{display:flex;flex-wrap:wrap;gap:6px;min-width:0}
.copt .sgw .seg{flex-wrap:nowrap}
.copt .seg .sl{display:inline-flex;align-items:center;padding:0 10px;border-right:1px solid var(--line);background:var(--rail);font-size:12px;color:var(--muted);white-space:nowrap;cursor:default;user-select:none}
/* the feature name is a label, not a button: its own quiet fill (--rail), never the selected fill (--tag) (request, 23 Nov 2026) */
.copt .lab{margin-right:-2px}
.copt .seg button.on{color:var(--text)}
.cvpb .ct{font:500 11px var(--mono);color:var(--muted);margin-left:4px}
.seg{display:inline-flex;flex-wrap:wrap;border:1px solid var(--line);border-radius:4px;overflow:hidden}
.seg button{height:28px;padding:0 10px;border:0;border-right:1px solid var(--line);background:none;cursor:pointer;font-size:12.5px;white-space:nowrap}
.seg button:last-child{border-right:0}
.seg button.on{background:var(--tag);font-weight:600}
.replay{height:28px;padding:0 12px;border:1px solid var(--line);border-radius:4px;background:none;cursor:pointer;font-weight:500}
.replay:hover{border-color:var(--accent)}
/* the description is ONE line, cut with an ellipsis, and a chevron at its end opens / closes the whole text (request,
   20 Nov 2026). The chevron shows only when the line is actually cut, or while it is open. */
.cdescw{display:flex;align-items:flex-start;gap:4px;margin-top:3px;max-width:76ch}
.cdesc{flex:1;min-width:0;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.cdescw.is-open .cdesc{white-space:normal}
.cdesct{flex:0 0 auto;display:grid;place-items:center;width:20px;height:20px;margin-top:0;padding:0;border:0;border-radius:4px;background:none;color:var(--muted);cursor:pointer}
.cdesct:hover{color:var(--text);background:var(--tag)}.cdesct svg{width:14px;height:14px;transition:transform .15s}.cdescw.is-open .cdesct svg{transform:rotate(180deg)}
/* the stage is resizable: drag its right edge, bottom edge or corner. The size is remembered per browser. */
.cframe{position:relative;margin-top:14px;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--bg);height:660px;width:100%;max-width:100%;min-width:320px;min-height:280px}
.cframe.is-drag iframe{pointer-events:none}
.cframe.is-drag{border-color:var(--accent)}
.rz{position:absolute;z-index:2;touch-action:none}
.rz::after{content:"";position:absolute;background:var(--accent);opacity:0;transition:opacity .12s}
.rz:hover::after,.cframe.is-drag .rz::after{opacity:1}
.rz-r{top:0;right:0;bottom:14px;width:8px;cursor:ew-resize}
.rz-r::after{top:0;bottom:0;right:0;width:2px}
.rz-b{left:0;right:14px;bottom:0;height:8px;cursor:ns-resize}
.rz-b::after{left:0;right:0;bottom:0;height:2px}
.rz-c{right:0;bottom:0;width:16px;height:16px;cursor:nwse-resize;background:
  linear-gradient(135deg,transparent 0 50%,var(--muted) 50% 58%,transparent 58% 70%,var(--muted) 70% 78%,transparent 78%)}
.rz-c::after{display:none}
.csize{height:28px;padding:0 10px;border:1px solid var(--line);border-radius:4px;background:none;cursor:pointer;font:500 11.5px var(--mono);color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.csize:hover{border-color:var(--accent);color:var(--text)}
.cframe iframe{display:block;width:100%;height:100%;border:0}
/* a stage with a fixed viewport (Setting: 1920 x 1080) renders at that size and is scaled to the frame's width */
.cframe.is-vp iframe{position:absolute;left:0;top:0;transform-origin:0 0}
/* screen size: one small button in the action row opens it (request, 23 Nov 2026: "set on top with minimal ui") */
.cvpw{position:relative}
.cvpb{display:inline-flex;align-items:center;gap:4px;height:28px;padding:0 6px 0 10px;border:1px solid var(--line);border-radius:4px;background:none;cursor:pointer;font:500 11.5px var(--mono);color:var(--muted);font-variant-numeric:tabular-nums;white-space:nowrap}
.cvpb:hover,.cvpw.is-open .cvpb{border-color:var(--accent);color:var(--text)}
.cvpb svg{width:14px;height:14px;transition:transform .15s}.cvpw.is-open .cvpb svg{transform:rotate(180deg)}
.cvp{display:none;position:absolute;right:0;top:calc(100% + 6px);z-index:20;flex-direction:column;gap:2px;width:196px;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);font-size:12px;color:var(--muted)}
.cvpw.is-open .cvp{display:flex}
.cvp .vrow{display:flex;align-items:center;gap:6px;padding-bottom:8px;margin-bottom:4px;border-bottom:1px solid var(--line)}
.cvp input{width:64px;height:28px;padding:0 8px;border:1px solid var(--line);border-radius:4px;background:none;color:var(--text);font:500 12px var(--mono);font-variant-numeric:tabular-nums}
.cvp input:focus{outline:0;border-color:var(--accent)}
.cvp button{height:28px;padding:0 8px;border:0;border-radius:4px;background:none;color:var(--muted);font:500 11.5px var(--mono);cursor:pointer;text-align:left;white-space:nowrap}
.cvp button:hover{color:var(--text);background:var(--tag)}
.cvp button.on{background:var(--pill);color:var(--ink)}
.cmsg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center;color:var(--muted)}
.listh{margin:34px 0 0;font:600 15px var(--sans)}

.blank{margin-top:26px;padding:28px 0;color:var(--muted);max-width:60ch}
.blank b{display:block;color:var(--text);font-size:14px;margin-bottom:4px}
.warnline{margin-top:14px;color:var(--warn);font-size:12px}

@media (max-width:760px){
  .app{grid-template-columns:minmax(0,1fr)}
  .rail{position:static;height:auto;border-right:0;border-bottom:1px solid var(--rail-line);padding-bottom:6px;
    padding-left:max(6px, env(safe-area-inset-left, 0px));padding-right:max(6px, env(safe-area-inset-right, 0px))}
  .strig{padding:0 10px}
  .strcol{display:none}
  .smenu{display:flex;flex-wrap:wrap;overflow:visible;padding:0 4px}
  .smenu .find{flex:1 0 100%;margin:0 6px 10px}
  .kids{display:contents}
  .mod,.kids .mod{width:auto;margin:0 6px 8px;padding:0 10px}
  .mod.zero,.mod.exp,.gap{display:none}
  .sfoot{padding:0 4px;margin:0}
  .sfoot::before{display:none}
  .main{padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px));padding-block:18px 40px}
  .cgrid{grid-template-columns:minmax(0,1fr);gap:14px}
  .clist{flex-direction:row;flex-wrap:wrap;gap:4px}
  .ctab{min-height:30px}
  .ctab i{display:none}
  .ccat{flex:1 0 100%;padding:6px 4px 2px}
  .item{grid-template-columns:minmax(0,1fr)}
  .open{grid-column:1;grid-row:auto;justify-self:start;margin-top:8px}
}
</style>

<div class="app">
  <aside class="rail">
    <div class="shead">
    <button class="strig" data-m="all" title="All work">
      <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><path d="M13.9922 9.99629V0.167969C19.0183 1.00752 22.981 4.97021 23.8205 9.99629H13.9922Z" fill="#F37564"></path><path d="M23.9888 12.2574C23.8545 18.7612 18.5373 24 12 24C5.46269 24 0 18.6269 0 12C0 11.3172 0.0559702 10.6455 0.16791 9.99624C1.10821 4.41045 5.91045 0.123134 11.7426 0V4.95895C8.68656 5.0709 6.12314 7.15298 5.29478 9.98504C5.10448 10.6119 5.00373 11.2836 5.00373 11.9888C5.00373 15.8731 8.13808 19.0186 12 19.0186C12.694 19.0186 13.3657 18.9179 14.0038 18.7276C16.8134 17.8881 18.8843 15.3134 18.9962 12.2462H24L23.9888 12.2574Z" fill="currentColor"></path></svg>
      <b>ObserveOps</b>
    </button>
    <button class="strcol" id="railBtn" title="Collapse sidebar" aria-label="Collapse sidebar">
      <svg viewBox="0 0 48 48" aria-hidden="true"><path fill-rule="evenodd" d="M11 8h26a5 5 0 0 1 5 5v22a5 5 0 0 1-5 5H11a5 5 0 0 1-5-5V13a5 5 0 0 1 5-5Zm0 3.6c-.8 0-1.4.6-1.4 1.4v22c0 .8.6 1.4 1.4 1.4h26c.8 0 1.4-.6 1.4-1.4V13c0-.8-.6-1.4-1.4-1.4H11Z"></path><path d="M16.2 9.5h3.4v29h-3.4z"></path><g><path d="M26.5 17.6 32.9 24l-6.4 6.4-2.4-2.4 4-4-4-4 2.4-2.4Z"></path></g></svg>
    </button>
    </div>
    <nav class="smenu" id="nav" aria-label="Modules"></nav>
    <div class="sfoot" id="foot"></div>
  </aside>
  <main class="main">
    <div class="head">
      <div class="eyebrow" id="eyebrow"></div>
      <h1 id="title"></h1>
      <div class="sum" id="sum"></div>
    </div>
    <div id="note"></div>
    <section class="stage" id="stage" hidden>
      <h2>Components</h2>
      <div class="sub"><span id="cIntro"></span><span class="cbuild" id="cBuild"></span></div>
      <div class="cgrid">
        <nav class="clist" id="cTabs" aria-label="Components"></nav>
        <div class="cmain">
          <div class="chead">

    if (!F.req) F.req = stageFetch()
      .then(function(t){ F.html = t; F.at = Date.now(); if (CS.mod === mod){ stageBuild(); if (S.cur === mod) stageLoad(); } })
      .catch(function(){ F.err = true; if (CS.mod === mod) stageLoad(); });

     it fetched an hour ago. So: every load asks the server whether it changed (cache:'no-cache' is a cheap revalidation, not
     a re-download), and a stage that has been in memory for 20s is checked again in the background and swapped in if newer. */
  if (!F.chk && Date.now() - F.at > 20000){
    F.chk = stageFetch().then(function(t){ F.chk = null; F.at = Date.now(); if (t !== F.html){ F.html = t; if (CS.mod === mod){ stageBuild(); if (S.cur === mod) stageLoad(); } } })

function vpPaint(){ var el = document.getElementById('cVp'), v = vpGet(); if (!el) return; el.hidden = !v; if (!v) return;
  el.innerHTML = '<div class="vrow"><input id="cVpW" type="number" min="320" max="3840" aria-label="Screen width" value="' + v[0] + '"><span>\u00d7</span>' +
    '<input id="cVpH" type="number" min="240" max="2160" aria-label="Screen height" value="' + v[1] + '"></div>' +
    VP_PRESETS.map(function(p){ return '<button data-vp="' + p[0] + 'x' + p[1] + '" class="' + (p[0] === v[0] && p[1] === v[1] ? 'on' : '') + '">' + p[0] + '\u00d7' + p[1] + '</button>'; }).join(''); }
document.addEventListener('change', function(e){ if (e.target.id === 'cVpW' || e.target.id === 'cVpH') vpSet(+document.getElementById('cVpW').value, +document.getElementById('cVpH').value); });
document.addEventListener('keydown', function(e){ if (e.key === 'Enter' && (e.target.id === 'cVpW' || e.target.id === 'cVpH')) e.target.blur(); });
document.addEventListener('click', function(e){ var b = e.target.closest('[data-vp]'); if (!b) return; var p = b.getAttribute('data-vp').split('x'); vpSet(+p[0], +p[1]); vpClose(); });
/* the screen popover closes on a preset, an outside click or Esc */
function vpClose(){ if (!CS.vpOpen) return; CS.vpOpen = false; var w = document.querySelector('#cAct .cvpw'); if (w) w.classList.remove('is-open'); var t = document.getElementById('cVpB'); if (t) t.setAttribute('aria-expanded', 'false'); }
document.addEventListener('click', function(e){ if (!e.target.closest('#cAct .cvpw')) vpClose(); });
document.addEventListener('keydown', function(e){ if (e.key === 'Escape') vpClose(); });
function vpFit(){ var b = document.getElementById('cBox'), f = document.getElementById('cFrame'), vp = vpGet();
  if (!b || !f) return; b.classList.toggle('is-vp', !!vp);
  if (!vp){ f.style.width = f.style.height = f.style.transform = f.style.left = f.style.top = ''; b.style.height = RZ.h + 'px'; return; }
  /* the frame is sized freely (drag any edge or corner, 20 Nov 2026); the screen keeps its resolution and is scaled to FIT
     inside it, centred - it used to set the frame's height from the screen's ratio and hide the bottom handles */
  b.style.height = RZ.h + 'px';
  var bw = b.clientWidth, bh = b.clientHeight, s = Math.min(bw / vp[0], bh / vp[1]);
  f.style.width = vp[0] + 'px'; f.style.height = vp[1] + 'px'; f.style.transform = 'scale(' + s + ')';
  f.style.left = Math.max(0, Math.round((bw - vp[0] * s) / 2)) + 'px'; f.style.top = Math.max(0, Math.round((bh - vp[1] * s) / 2)) + 'px'; }
function rzLabel(){ var b = document.getElementById('cBox'), l = document.getElementById('cSize'); if (!b || !l) return;
  var r = b.getBoundingClientRect(), vp = vpGet(), vb = document.getElementById('cVpB');
  if (vb && vp) vb.innerHTML = 'Screen ' + vp[0] + ' \u00d7 ' + vp[1] + ' \u00b7 ' + Math.round(Math.min(b.clientWidth / vp[0], b.clientHeight / vp[1]) * 100) + '%<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path stroke="none" d="M0 0h24v24H0z" fill="none" /><path d="M6 9l6 6l6 -6" /></svg>';
  /* a sized screen: the frame's own size, then the screen and the scale it is shown at */
  l.textContent = Math.round(r.width) + ' \u00d7 ' + Math.round(r.height); }
function rzSave(){ try { localStorage.setItem('mw-stage-size', JSON.stringify(RZ)); } catch (e) {} }
try { var rz0 = JSON.parse(localStorage.getItem('mw-stage-size') || 'null'); if (rz0 && rz0.h){ RZ.w = +rz0.w || 0; RZ.h = Math.max(280, Math.min(1600, +rz0.h)); } } catch (e) {}
rzApply();
document.addEventListener('pointerdown', function(e){
  var hd = e.target.closest('.rz'); if (!hd) return;
  var box = document.getElementById('cBox'), mode = hd.getAttribute('data-rz'), r = box.getBoundingClientRect();
  /* width runs from 320px past the column out to the window's edge (20 Nov 2026: it was capped at the column, so a frame
     that starts full width could never be dragged wider and only its height seemed to change) */
  var col = box.parentElement.getBoundingClientRect().width, max = Math.max(col, document.documentElement.clientWidth - r.left - 16), x0 = e.clientX, y0 = e.clientY;
  e.preventDefault(); box.classList.add('is-drag'); try { hd.setPointerCapture(e.pointerId); } catch (er) {}
  function mv(ev){
    if (mode !== 'b'){ var w = Math.max(320, Math.min(max, r.width + ev.clientX - x0)); RZ.w = Math.abs(w - col) <= 1 ? 0 : Math.round(w); }
    if (mode !== 'r') RZ.h = Math.round(Math.max(280, Math.min(1600, r.height + ev.clientY - y0)));
    rzApply();
  }
  function up(){ hd.removeEventListener('pointermove', mv); hd.removeEventListener('pointerup', up); hd.removeEventListener('pointercancel', up); box.classList.remove('is-drag'); rzSave(); }
  hd.addEventListener('pointermove', mv); hd.addEventListener('pointerup', up); hd.addEventListener('pointercancel', up);
});
window.addEventListener('resize', function(){ vpFit(); rzLabel(); });
try { new ResizeObserver(function(){ vpFit(); rzLabel(); }).observe(document.getElementById('cBox')); } catch (e) {}

document.addEventListener('click', function(e){
  var b = e.target.closest('#stage button'); if (!b || b.closest('#cVp')) return;
  if (b.hasAttribute('data-vpt')){ CS.vpOpen = !CS.vpOpen; var w = b.parentNode; w.classList.toggle('is-open', CS.vpOpen); b.setAttribute('aria-expanded', String(CS.vpOpen)); return; }
  if (b.hasAttribute('data-c')){ CS.k = b.getAttribute('data-c'); var c = SC().filter(function(x){ return x.k === CS.k; })[0]; CS.v = c.vs.length ? c.vs[0][0] : ''; }
  else if (b.hasAttribute('data-vg')){ var cg = SC().filter(function(x){ return x.k === CS.k; })[0], gn = b.getAttribute('data-vg'), g = vGroups(cg).filter(function(x){ return x.name === gn; })[0];
    if (!g || g.items.some(function(it){ return it.v === CS.v; })) return;
    var kept = CS.gsel[CS.k + '|' + gn]; CS.v = g.items.some(function(it){ return it.v === kept; }) ? kept : g.items[0].v; }
  else if (b.hasAttribute('data-v')) CS.v = b.getAttribute('data-v');
  else if (b.hasAttribute('data-th')) CS.th = b.getAttribute('data-th');
  else if (b.hasAttribute('data-rzreset')){ RZ.w = 0; RZ.h = 660; rzApply(); rzSave(); return; }
  else if (!b.hasAttribute('data-replay')) return;
  /* remember the state picked inside each option, so going back to that option returns to it */
  if (b.hasAttribute('data-v') || b.hasAttribute('data-vg')) vGroups(SC().filter(function(x){ return x.k === CS.k; })[0]).forEach(function(g){ if (g.items.some(function(it){ return it.v === CS.v; })) CS.gsel[CS.k + '|' + g.name] = CS.v; });
  stagePaint(); stageLoad();
});

function paintMain(){
  stageSync();
  var all = S.cur === 'all', m = MOD[S.cur];
  document.getElementById('eyebrow').textContent = all ? 'ObserveOps prototypes' : (m.kid ? 'Explorer module' : 'Module');
  document.getElementById('title').textContent = all ? 'All work' : m.name;
  var q = S.q.trim().toLowerCase();
  var rows = S.rows.filter(function(r){
    if (!all && r.module !== S.cur) return false;
    if (!q) return true;
    return [r.title, r.note, r.kind, r.file, (MOD[r.module] || {}).name].join(' ').toLowerCase().indexOf(q) >= 0;
  }).sort(byDate);

  var sum = document.getElementById('sum'), body = document.getElementById('body');
  document.getElementById('note').innerHTML = S.stale ? '<div class="warnline">The list cannot be reached right now, so it may be out of date.</div>' : '';

  /* a module with a stage (Mira AI, Dashboard) shows its components live there, so it carries no list of rows */
  if (STAGES[S.cur]){ var nc = STAGES[S.cur].comps.length; sum.textContent = nc + ' live component' + (nc === 1 ? '' : 's'); body.innerHTML = ''; return; }
  if (S.state === 'loading'){ sum.textContent = 'Loading the work list…'; body.innerHTML = ''; return; }
  if (S.state === 'off'){
    sum.textContent = '';
    body.innerHTML = '<div class="blank"><b>The work list is not available in this view</b>Open this page signed in to claude.ai to see what has been built for each module.</div>';
    return;
  }
  var mods = {}; S.rows.forEach(function(r){ mods[r.module] = 1; });
  sum.textContent = all ? plural(S.rows.length, 'item') + ' across ' + plural(Object.keys(mods).length, 'module')
                        : plural(count(S.cur), 'item') + ' built for this module';

  if (!rows.length){
    body.innerHTML = '<div class="blank">' + (q
      ? '<b>Nothing matches “' + esc(S.q.trim()) + '”</b>Try a page name, a file name or a module.'
      : all ? '<b>No work added yet</b>Each prototype, page or flow built for a module is listed here as it is created.'
            : '<b>Nothing built for ' + esc(m.name) + ' yet</b>Work created for this module is added here, with its file and a link to open it.') + '</div>';
    return;
  }
  if (!all){ body.innerHTML = '<div class="sec">' + rows.map(itemHTML).join('') + '</div>'; return; }
  var h = '';
  ORDER.forEach(function(slug){
    var rs = rows.filter(function(r){ return r.module === slug; });
    if (rs.length) h += '<section class="sec"><div class="sech"><button data-m="' + slug + '">' + esc(MOD[slug].name) + '</button><span>' + plural(rs.length, 'item') + '</span></div>' + rs.map(itemHTML).join('') + '</section>';
  });
  var other = rows.filter(function(r){ return !MOD[r.module]; });
  if (other.length) h += '<section class="sec"><div class="sech"><button disabled>Other</button><span>' + plural(other.length, 'item') + '</span></div>' + other.map(itemHTML).join('') + '</section>';
  body.innerHTML = h;
}
function paint(){ paintNav(); paintMain(); }

function go(slug){
  S.cur = (slug === 'all' || MOD[slug]) ? slug : 'all';
  var want = S.cur === 'all' ? '' : '#m-' + S.cur;
  if (location.hash !== want){ try { history.replaceState(null, '', want || location.pathname + location.search); } catch (e) { location.hash = want; } }
  paint();
}
function fromHash(){ var m = /^#m-([a-z0-9-]+)$/.exec(location.hash); S.cur = m && MOD[m[1]] ? m[1] : 'all'; paint(); }

/* collapse / expand the sidebar (remembered per browser) */
function railSet(min, save){
  document.querySelector('.app').classList.toggle('is-railmin', min);
  var b = document.getElementById('railBtn'), t = min ? 'Expand sidebar' : 'Collapse sidebar';
  b.title = t; b.setAttribute('aria-label', t);
  if (save){ try { localStorage.setItem('mw-railmin', min ? '1' : '0'); } catch (e) {} }
}
function railMin(){ return document.querySelector('.app').classList.contains('is-railmin'); }
try { if (localStorage.getItem('mw-railmin') === '1') railSet(true); } catch (e) {}

document.addEventListener('click', function(e){
  if (e.target.closest('#railBtn')){ railSet(!railMin(), true); return; }
  if (railMin() && e.target.closest('.find, [data-exp]')){
    var wasFind = !!e.target.closest('.find'); railSet(false, true);
    if (wasFind){ e.preventDefault(); document.getElementById('find').focus(); return; }
    S.exp = true; paint(); return;
  }
  var x = e.target.closest('[data-exp]'); if (x){ S.exp = !(S.exp || (MOD[S.cur] && MOD[S.cur].kid)); if (MOD[S.cur] && MOD[S.cur].kid && !S.exp) S.cur = 'all'; paint(); return; }
  var b = e.target.closest('[data-m]'); if (b) go(b.getAttribute('data-m'));
});
document.addEventListener('input', function(e){ if (e.target.id === 'find'){ S.q = e.target.value; paintMain(); } });
window.addEventListener('hashchange', fromHash);
fromHash();

/* The records live in the artifact's database (collection "work"), not in this file. */
(async function(){
  var db = null;
  try { db = window.claude && window.claude.use ? await window.claude.use('db') : null; } catch (e) { db = null; }
  if (!db){ S.state = 'off'; paint(); return; }
  var timer = setTimeout(function(){ if (S.state === 'loading') S.state = 'ready'; S.stale = true; paint(); }, 10000);
  db.collection('work').onSnapshot(function(snap){
    S.rows = snap.docs.map(function(d){ var o = d.data() || {}; return Object.assign({}, o, { id:d.id }); });
    S.state = 'ready';
    if (!snap.metadata.fromCache){ clearTimeout(timer); S.stale = false; }
    paint();
  }, function(){ clearTimeout(timer); S.state = S.rows.length ? 'ready' : 'off'; S.stale = !!S.rows.length; paint(); });
})();
</script>

</body></html>
