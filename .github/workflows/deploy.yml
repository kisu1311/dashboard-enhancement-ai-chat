name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Auto-connect variant pages
        run: node _sync_variants.js
      # Shrink the PUBLISHED copy only (strips comments + whitespace, renames nothing).
      # index.html goes ~3 MB -> ~1.5 MB; the source on main keeps every comment.
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Minify site for Pages
        run: |
          npm install --no-save --no-package-lock html-minifier-terser@7.2.0 terser@5.36.0
          node _build/minify-site.mjs .
          rm -rf node_modules
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      # ⚠️ If this step fails instantly with "Timeout reached, aborting!", read the real
      # message underneath it — on 27 Aug 2026 it was:
      #   "Deployment request failed ... due to in progress deployment.
      #    Please cancel <sha> first or wait for it to complete."
      # A Pages deployment stuck in-progress on GitHub's side blocks every later one, and
      # the generic timeout text hides that. It is NOT the workflow, the artifact size or
      # the action version. Cancel the stuck deployment (repo -> Deployments /
      # Environments -> github-pages) or wait for GitHub to time it out.
      - uses: actions/deploy-pages@v4
        id: deployment
